[package]
name = "slowroads"
version = "2.5.1"
description = "Slow Roads desktop app"
authors = [""]
edition = "2021"

[lib]
name = "slowroads_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
