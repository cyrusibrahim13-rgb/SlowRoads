name: Build release installers

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: slow-roads-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS Universal
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            files: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check macOS signing configuration
        if: startsWith(matrix.name, 'macOS')
        id: macos_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "macOS Developer ID secrets are incomplete; using an ad hoc code signature."
          fi

      - name: Validate macOS certificate payload
        if: startsWith(matrix.name, 'macOS') && steps.macos_signing.outputs.ready == 'true'
        id: macos_certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/slowroads-signing.p12"
          if python3 - "$certificate" <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path
          try:
              Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"], validate=True))
          except Exception:
              raise SystemExit(1)
          PY
          then
            if openssl pkcs12 -in "$certificate" -passin "env:APPLE_CERTIFICATE_PASSWORD" -noout >/dev/null 2>&1; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "macOS certificate payload is valid."
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "macOS certificate payload is invalid; using an ad hoc code signature."
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "macOS certificate is not valid base64; using an ad hoc code signature."
          fi
          rm -f "$certificate"

      - name: Import macOS signing certificate
        if: startsWith(matrix.name, 'macOS') && steps.macos_signing.outputs.ready == 'true' && steps.macos_certificate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: npm install

      - name: Build signed macOS installer
        if: startsWith(matrix.name, 'macOS') && steps.macos_signing.outputs.ready == 'true' && steps.macos_certificate.outputs.ready == 'true'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}

      - name: Build ad hoc macOS installer
        if: startsWith(matrix.name, 'macOS') && (steps.macos_signing.outputs.ready != 'true' || steps.macos_certificate.outputs.ready != 'true')
        shell: bash
        run: |
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD -u APPLE_SIGNING_IDENTITY -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID APPLE_SIGNING_IDENTITY=- npm run dist:mac

      - name: Build Windows installer
        if: matrix.name == 'Windows'
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: slow-roads-${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    name: Create or update versioned release
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Generate Markdown release notes
        run: npm run release:notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: slow-roads-*
          path: release-assets
          merge-multiple: true

      - name: Create or update versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Slow Roads v${{ steps.version.outputs.value }}
          body_path: release-notes/v${{ steps.version.outputs.value }}.md
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-notes/v${{ steps.version.outputs.value }}.md
