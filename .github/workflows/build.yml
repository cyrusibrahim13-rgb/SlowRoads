name: Build release installers

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: slow-roads-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npm run dist:mac
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            command: npm run dist:win
            files: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: slow-roads-${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    name: Create versioned release
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read app version
        id: version
        shell: bash
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Generate Markdown release notes
        run: npm run release:notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: slow-roads-*
          path: release-assets
          merge-multiple: true

      - name: Create or update versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Slow Roads v${{ steps.version.outputs.value }}
          body_path: release-notes/v${{ steps.version.outputs.value }}.md
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-notes/v${{ steps.version.outputs.value }}.md
