name: Build release installers

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: slow-roads-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            command: npm run dist:mac
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            command: npm run dist:win
            files: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: slow-roads-${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    name: Create release
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: slow-roads-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && format('commit-{0}', github.sha) || github.event.release.tag_name }}
          name: ${{ github.event_name == 'push' && format('Slow Roads {0}', github.sha) || github.event.release.name }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
